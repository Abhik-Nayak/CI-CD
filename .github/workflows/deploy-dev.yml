name: Deploy to Development

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/my-pern-app/CI-CD

            # Stop the running app
            pm2 stop todo-server || true

            # Pull latest code
            git pull origin dev

            # Install server dependencies
            cd server
            npm install

            # Start the app
            pm2 restart todo-server || pm2 start index.js --name todo-server
            cd ..

            # Build the React client
            cd client
            npm install
            npm run build

            # Show status
            pm2 status
