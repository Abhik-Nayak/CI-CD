name: Deploy to EC2 (Dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/CI-CD
            
            echo "📥 Pulling latest code from dev branch..."
            git pull origin dev

            echo "📦 Installing both frontend  & backend dependencies... "
            npm run install-all

            echo "🛑 Stopping existing processes..."
            pkill -f "node" || true
            sleep 2

            echo "🚀 Starting frontend and backend...  Start app in background so SSH session can exit"
            nohup npm run dev > ~/CI-CD/app.log 2>&1 &
            cd ..

            echo "✅ Deployment complete!"

            # Important: Without nohup ... &, the npm run dev command would run in the foreground and the GitHub Action would wait forever until it times out (6 hours). That's why we need to run it in the background.