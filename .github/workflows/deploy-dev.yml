name: Deploy to EC2 (Dev)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Kill any process running on port 5000 and 5173
            fuser -k 5000/tcp || true
            fuser -k 5173/tcp || true

            cd ~/CI-CD
            git pull origin dev
            npm run install-all

            # Start app in background so SSH session can exit
            nohup npm run dev > ~/CI-CD/app.log 2>&1 &
