name: Deploy to Development

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Print test message
        run: echo "GitHub Actions workflow triggered on dev branch!"

      - name: Show current directory
        run: pwd

      - name: List files
        run: ls -la