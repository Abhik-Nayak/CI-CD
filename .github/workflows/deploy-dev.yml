name: Deploy to Development

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export PATH="$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node/)/bin:$PATH"

            # Install PM2 if not present
            command -v pm2 || sudo npm install -g pm2

            cd ~/my-pern-app/CI-CD

            # Stop the running app
            pm2 stop todo-server || true

            # Discard any local changes on EC2 and pull latest
            git reset --hard
            git pull origin dev

            # Install server dependencies and start
            cd server
            npm install
            pm2 restart todo-server || pm2 start index.js --name todo-server
            cd ..

            # Build the React client
            cd client
            npm install
            npm run build

            # Show status
            pm2 status
