services:

  # ── Auth microservice ───────────────────────────────────────────────────────
  # Owns auth_db (users). Signs JWTs. Uses LOCAL host Postgres (no db container).
  auth-service:
    build: ./auth-service
    ports:
      - "5002:5002"                       # exposed for direct local testing/debug
    env_file:
      - ./auth-service/.env               # PORT, DB_*, JWT_SECRET
    environment:
      DB_HOST: host.docker.internal       # overrides .env — points to host Postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - todo-network

  # ── Todo microservice ───────────────────────────────────────────────────────
  # Owns todo_db (todos). Verifies JWTs with the SAME JWT_SECRET as auth-service.
  todo-service:
    build: ./todo-service
    ports:
      - "5001:5001"                       # exposed for direct local testing/debug
    env_file:
      - ./todo-service/.env
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - todo-network

  # ── React + nginx (API gateway) ──────────────────────────────────────────────
  client:
    build: ./client
    ports:
      - "80:80"
      - "8080:8080"
    networks:
      - todo-network
    depends_on:
      - auth-service
      - todo-service

# ── Shared Network ─────────────────────────────────────────────────────────
networks:
  todo-network:
    driver: bridge
