services:

  # ── Express API ────────────────────────────────────────────────────────────
  # Uses the LOCAL host Postgres (no db container).
  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env                    # loads PORT, DB_USER, DB_PASS, DB_PORT, DB_NAME, JWT_SECRET
    environment:
      DB_HOST: host.docker.internal      # overrides .env — points to host machine's Postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"  # makes host.docker.internal resolve on Linux too
    networks:
      - todo-network

  # ── React + nginx ──────────────────────────────────────────────────────────
  client:
    build: ./client
    ports:
      - "80:80"
      - "8080:8080"
    networks:
      - todo-network
    depends_on:
      - server

# ── Shared Network ─────────────────────────────────────────────────────────
networks:
  todo-network:
    driver: bridge
