services:

  # ── Express API ────────────────────────────────────────────────────────────
  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env           # loads PORT, DB_USER, DB_PASS, DB_PORT, DB_NAME, JWT_SECRET
    networks:
      - todo-network

  # ── React + nginx ──────────────────────────────────────────────────────────
  client:
    build: ./client
    ports:
      - "80:80"
    networks:
      - todo-network
    depends_on:
      - server

# ── Shared Network ─────────────────────────────────────────────────────────
networks:
  todo-network:
    driver: bridge
