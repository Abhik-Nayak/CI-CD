services:

  # ── Auth microservice ───────────────────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    env_file:
      - ./services/auth-service/.env
    environment:
      DB_HOST: host.docker.internal       # EC2 host where Postgres runs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - todo-network

  # ── Todo microservice ───────────────────────────────────────────────────────
  todo-service:
    build: ./services/todo-service
    env_file:
      - ./services/todo-service/.env
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - todo-network

  # ── API Gateway ──────────────────────────────────────────────────────────────
  # Single backend entry point. Not host-exposed — only the client reaches it.
  gateway:
    build: ./services/gateway
    restart: unless-stopped
    networks:
      - todo-network
    depends_on:
      - auth-service
      - todo-service

  # ── React + nginx (static SPA) ────────────────────────────────────────────────
  # The ONLY host-exposed container. Serves the SPA and forwards /api → gateway.
  client:
    build: ./client
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - todo-network
    depends_on:
      - gateway

networks:
  todo-network:
    driver: bridge
