services:

  # ── Auth microservice ───────────────────────────────────────────────────────
  auth-service:
    build: ./auth-service
    env_file:
      - ./auth-service/.env
    environment:
      DB_HOST: host.docker.internal       # EC2 host where Postgres runs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - todo-network

  # ── Todo microservice ───────────────────────────────────────────────────────
  todo-service:
    build: ./todo-service
    env_file:
      - ./todo-service/.env
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - todo-network

  # ── React + nginx (API gateway) ──────────────────────────────────────────────
  # In prod, services are NOT port-exposed to the host — only the gateway is.
  client:
    build: ./client
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - todo-network
    depends_on:
      - auth-service
      - todo-service

networks:
  todo-network:
    driver: bridge
