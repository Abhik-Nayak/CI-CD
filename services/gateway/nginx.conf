# =============================================================
# API GATEWAY  —  listen :80
# The single entry point for ALL backend traffic.
# Clients talk only to the gateway; the gateway decides which
# microservice handles each path. Services are never exposed
# to clients directly — only the gateway knows their addresses.
#
# This is the dedicated "gateway tier". In bigger systems this
# role is played by Kong / Traefik / AWS API Gateway / Spring
# Cloud Gateway — same job, more features (auth, quotas, retries).
# =============================================================
server {
    listen 80;

    # Gateway's own health check (independent of the services).
    location = /health {
        access_log off;
        return 200 "gateway ok\n";
    }

    # ── Route: Auth  →  auth-service ──────────────────────────
    # Docker DNS resolves "auth-service" to the container on the network.
    location /api/auth {
        proxy_pass http://auth-service:5002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Route: Todos  →  todo-service ─────────────────────────
    location /api/todos {
        proxy_pass http://todo-service:5001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
