# =============================================================
# REVERSE PROXY SERVER — port 80
# Sits in front of the BACKEND (server is hidden from browser)
# Browser talks to nginx, nginx talks to Express
# Browser never knows Express exists on port 5000
# Your client/nginx.conf (listen 80) is not
#   used when you run npm run build / npm run preview on your laptop.
#      nginx only exists inside the Docker container
# =============================================================
server {
    listen 80;

    # Where React build files are stored inside the container
    root /usr/share/nginx/html;

    # Default file to serve when someone visits /
    index index.html;

    # ── Static File Server ────────────────────────────────────
    # Serves React build files (HTML, CSS, JS)
    # try_files checks in order:
    #   1. exact file match ($uri)
    #   2. folder match ($uri/)
    #   3. fallback to index.html — lets React Router handle the route (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Forward ALL /api to the gateway tier ──────────────────
    # The client is now "dumb": it serves static files and forwards every
    # /api request to the single gateway. It does NOT know auth-service or
    # todo-service exist — that routing is the gateway's job.
    # "gateway" = Docker Compose service name, resolved by Docker DNS.
    location /api {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
