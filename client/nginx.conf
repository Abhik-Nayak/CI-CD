server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA routing — any path not matching a real file (e.g. /todos/1)
    # falls back to index.html so React Router handles it client-side
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api requests to the backend container
    # "server" is the Docker Compose service name — Docker's internal DNS resolves it
    # The browser never talks to the backend directly — only nginx does
    location /api {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;

        # Forward real client IP and host to Express
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
