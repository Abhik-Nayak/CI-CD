# =============================================================
# REVERSE PROXY SERVER — port 80
# Sits in front of the BACKEND (server is hidden from browser)
# Browser talks to nginx, nginx talks to Express
# Browser never knows Express exists on port 5000
# =============================================================
server {
    listen 80;

    # Where React build files are stored inside the container
    root /usr/share/nginx/html;

    # Default file to serve when someone visits /
    index index.html;

    # ── Static File Server ────────────────────────────────────
    # Serves React build files (HTML, CSS, JS)
    # try_files checks in order:
    #   1. exact file match ($uri)
    #   2. folder match ($uri/)
    #   3. fallback to index.html — lets React Router handle the route (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Reverse Proxy ─────────────────────────────────────────
    # Any request starting with /api is forwarded to Express
    # "server" = Docker Compose service name, Docker DNS resolves it
    # Browser hits /api/todos → nginx forwards to http://server:5000/api/todos
    # Browser never directly touches port 5000
    location /api {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;

        # Pass original request info to Express
        # Without these, Express would see nginx's IP instead of browser's IP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


# =============================================================
# FORWARD PROXY SERVER — port 8080
# Sits in front of the CLIENT (client identity is hidden)
# Client sets browser proxy to localhost:8080
# nginx forwards to whatever URL the client requested (dynamic)
# The destination website sees nginx's IP, not the client's IP
# =============================================================
server {
    listen 8080;

    # resolver = DNS server nginx uses to resolve dynamic hostnames
    # 8.8.8.8 = Google DNS (needed because destination is not hardcoded)
    resolver 8.8.8.8;

    # ── Forward Proxy ─────────────────────────────────────────
    # $scheme     = http or https (whatever client requested)
    # $host       = destination domain (e.g. google.com)
    # $request_uri = path + query (e.g. /search?q=nginx)
    # Combined: forwards to the exact URL the client wanted to reach
    # This is DYNAMIC — unlike reverse proxy where destination is hardcoded
    location / {
        proxy_pass $scheme://$host$request_uri;
        proxy_http_version 1.1;

        # Forward original Host header to destination server
        proxy_set_header Host $host;
    }
}
